<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HESI A2 Trainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>HESI A2 Trainer</h1>

  <select id="category" onchange="filterCategory()">
    <option value="All">All</option>
    <option value="Anatomy">Anatomy</option>
    <option value="Microbiology">Microbiology</option>
    <option value="Chemistry">Chemistry</option>
    <option value="Grammar">Grammar</option>
    <option value="Pharmacology">Pharmacology</option>
  </select>

  <p id="question">Loading...</p>

  <textarea id="user-answer" placeholder="Type your answer..."></textarea>

  <div class="buttons">
    <button onclick="checkAnswer()">Submit</button>
    <button onclick="showHint()">Hint</button>
    <button onclick="showChoices()">Choices</button>
  </div>

  <div id="choices" class="hidden"></div>
  <div id="feedback"></div>
  <div id="explanation"></div>

  <p id="score"></p>

  <button onclick="nextQuestion()">Next</button>
</div>

<script src="app.js"></script>
</body>
</html>
