<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HESI A2 Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>HESI A2 Trainer</h1>

    <div class="quiz-meta">
      <span id="topic">Loading topic…</span>
      <span id="progress"></span>
    </div>

    <p id="question" class="question">Loading questions…</p>
    <div id="choices" class="choices"></div>

    <p id="feedback" class="feedback" aria-live="polite"></p>
    <div id="explanation" class="explanation" aria-live="polite"></div>

    <div class="footer">
      <p id="score">Score: 0 / 0</p>

      <div class="button-row">
        <button id="nextButton" type="button" class="action-button next-button" disabled>
          Next Question
        </button>

        <button id="restartButton" type="button" class="action-button restart-button">
          Restart Quiz
        </button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
