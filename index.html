<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>HESI A2 Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">HESI A2 PRACTICE</p>
      <h1>HESI A2 Trainer</h1>
      <div class="status-row">
        <span id="topic">Loading topic…</span>
        <span id="progress">Question 0 of 0</span>
      </div>
    </header>

    <section class="quiz-card" aria-live="polite">
      <h2 id="question">Loading questions…</h2>
      <div id="choices" class="choices" role="group" aria-label="Answer choices"></div>
      <p id="feedback" class="feedback"></p>
      <p id="explanation" class="explanation"></p>
    </section>

    <div class="score-row">
      <p id="score">Score: 0 / 0</p>
      <button id="nextButton" class="next-button" type="button" disabled>Next Question</button>
    </div>

    <button id="restartButton" class="restart-button" type="button">Restart Quiz</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
